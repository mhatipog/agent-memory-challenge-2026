name: Test retrieval service
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integration + unit tests
        run: npm test
      - name: Synthetic memory benchmark
        run: npm run bench
      - name: Harder synthetic retrieval regression
        run: npm run bench:hard
      - name: Pinned third-party coding-memory corpus
        run: node scripts/public-coding-benchmark.mjs

      - name: Coding evidence retention and size research
        run: node scripts/scale-envelope.mjs
