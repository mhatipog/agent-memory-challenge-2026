name: Test retrieval service
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integration + unit tests
        run: npm test
      - name: Synthetic memory benchmark
        run: npm run bench
      - name: Harder synthetic retrieval regression
        run: npm run bench:hard
      - name: Pinned third-party coding-memory corpus
        run: node scripts/public-coding-benchmark.mjs

      - name: Offline FTS capacity envelope (not official performance)
        run: node scripts/capacity-envelope.mjs

      - name: Compressed evidence indexing ablation (public fixture)
        run: node scripts/compressed-memory-ablation.mjs

      - name: Compressed evidence sparse FTS storage feasibility (synthetic)
        run: node scripts/compressed-capacity.mjs

      - name: SQLite FTS trigger-write diagnostic (not D1 billing)
        run: node scripts/d1-write-budget.mjs

      - name: Intent-conditioned memory ablation (real public + synthetic)
        run: node scripts/intent-ablation.mjs
