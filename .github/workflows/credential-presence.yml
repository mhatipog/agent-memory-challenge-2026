name: AML secret presence only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/credential-presence.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AML_EVAL_KEY: ${{ secrets.AML_EVAL_KEY }}
      AML_MEMORY_API_KEY: ${{ secrets.AML_MEMORY_API_KEY }}
    steps:
      - name: Display flags (never credential bytes)
        shell: bash
        run: |
          if [ -n "${AML_EVAL_KEY:-}" ]; then echo "AML_EVAL_KEY configured in public source repo"; else echo "AML_EVAL_KEY absent in public source repo"; fi
          if [ -n "${AML_MEMORY_API_KEY:-}" ]; then echo "AML_MEMORY_API_KEY configured in public source repo"; else echo "AML_MEMORY_API_KEY absent in public source repo"; fi
          echo "No secrets are transmitted or printed."
